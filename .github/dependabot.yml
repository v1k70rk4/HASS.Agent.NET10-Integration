version: 2
updates:
  # Keep the GitHub Actions used by the hassfest / ruff / validate workflows
  # up to date and patched. Grouped into a single weekly PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"

  # Home Assistant and its test helpers for the tests (requirements_test.txt).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "test"
