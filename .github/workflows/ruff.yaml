name: Lint with Ruff

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # Pin ruff so a new release cannot silently change the default rule set
      # and turn CI red without a code change (bump this deliberately).
      - run: "python -m pip install ruff==0.16.1"
      - run: "ruff check custom_components/hass_agent"
