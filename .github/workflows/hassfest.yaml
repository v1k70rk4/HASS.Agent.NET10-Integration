name: Validate with hassfest

on:
  workflow_dispatch:
  push:
  pull_request:
#  schedule:
#    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  validate:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Home Assistant publishes hassfest on its master branch only (its one release, 1.0.0, is
      # years old), so this is pinned to a master commit. Dependabot moves the commit, but not
      # the date after it: write the new commit's date there when it does.
      - uses: home-assistant/actions/hassfest@9e9565e68f5a70d874202871f4c4064d23814235 # master 2026-11-23
